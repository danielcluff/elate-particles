<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>tsl-particles playground</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #05070c; font: 12px/1.4 ui-sans-serif, system-ui, sans-serif; color: #e5e7eb; }
      .panel { position: fixed; top: 12px; left: 12px; display: flex; flex-direction: column; gap: 8px; padding: 10px; border-radius: 10px; background: #0b0f18cc; border: 1px solid #ffffff1a; }
      .row { display: flex; gap: 6px; align-items: center; }
      button { font: inherit; color: inherit; background: #1d222b; border: 1px solid #ffffff1a; border-radius: 6px; padding: 4px 10px; cursor: pointer; }
      button.on { background: #e5e5e5; color: #171717; }
      #stats { font-family: ui-monospace, Menlo, monospace; color: #a1a1a1; }
    </style>
  </head>
  <body>
    <div class="panel">
      <div class="row">
        <button data-scene="campfire">Campfire</button>
        <button data-scene="thruster">Thruster</button>
        <button data-scene="explosion">Explosion</button>
        <button data-scene="tracers">Tracers</button>
        <button data-scene="fireworks">Fireworks</button>
        <button data-scene="stress">Stress</button>
      </div>
      <div class="row" id="throttle-row">throttle <input id="throttle" type="range" min="0" max="1" step="0.01" value="1" /></div>
      <div class="row" id="rate-row">explosions/s <input id="rate" type="range" min="1" max="200" step="1" value="20" /></div>
      <div class="row" id="budget-row">budget <input id="budget" type="range" min="0" max="60000" step="1000" value="0" /> <span id="budget-label">off</span></div>
      <div class="row" id="quality-row">quality <input id="quality" type="range" min="0" max="1" step="0.05" value="1" /> <span id="quality-label">1.00</span></div>
      <div id="stats"></div>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
